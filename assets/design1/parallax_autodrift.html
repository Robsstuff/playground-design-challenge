<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama — Auto Drift</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 60%, #1c1c2e 0%, #060606 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .scene {
    position: relative;
    width: min(92vw, 960px);
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 10px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 50px 120px rgba(0,0,0,0.95),
      0 20px 40px rgba(0,0,0,0.6);
  }

  /* Ken Burns: slow continuous zoom + gentle pan — no reset, loops */
  #kb {
    position: absolute;
    inset: 0;
    transform-origin: 52% 52%;
    animation: kbpulse 18s ease-in-out infinite alternate;
  }
  @keyframes kbpulse {
    0%   { transform: scale(1.00) translate(0%,    0%);    }
    33%  { transform: scale(1.06) translate(-1.5%, -1%);   }
    66%  { transform: scale(1.04) translate(1%,    1.5%);  }
    100% { transform: scale(1.00) translate(0%,    0%);    }
  }

  .lyr {
    position: absolute;
    top: -30%; left: -30%;
    width: 160%; height: 160%;
    background: url('photo.jpg') center / cover no-repeat;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  #l0 { z-index: 1; }

  #l1 {
    z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 20%, transparent 38%);
    mask-image: linear-gradient(to bottom, black 0%, black 20%, transparent 38%);
  }

  #l2 {
    z-index: 3;
    -webkit-mask-image: linear-gradient(to right,
      black 0%, black 23%, transparent 37%,
      transparent 63%, black 77%, black 100%);
    mask-image: linear-gradient(to right,
      black 0%, black 23%, transparent 37%,
      transparent 63%, black 77%, black 100%);
  }

  .scene::after {
    content: '';
    position: absolute;
    inset: 0; z-index: 10;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.45) 100%);
  }

  /* Fade-in on load */
  .scene { animation: fadein 2s ease both; }
  @keyframes fadein {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1);    }
  }

  #hint {
    position: fixed;
    bottom: 28px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.30);
    font: 13px/1 system-ui, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
    pointer-events: none;
    animation: hintfade 4s 3s ease both;
  }
  @keyframes hintfade {
    from { opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    to   { opacity: 0; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div id="kb">
    <div class="lyr" id="l0"></div>
    <div class="lyr" id="l1"></div>
    <div class="lyr" id="l2"></div>
  </div>
</div>
<p id="hint">Living photo</p>

<script>
  const layers = [
    { el: document.getElementById('l0'), amp: 18,  phX: 0.00, phY: 0.00, fX: 0.60, fY: 0.45 },
    { el: document.getElementById('l1'), amp: 45,  phX: 1.10, phY: 0.80, fX: 0.58, fY: 0.43 },
    { el: document.getElementById('l2'), amp: 90,  phX: 2.30, phY: 1.70, fX: 0.55, fY: 0.41 },
  ];

  // Each layer drifts on its own Lissajous path:
  //   x(t) = amp * sin(fX*t + phX) + small_harmonic
  //   y(t) = amp * cos(fY*t + phY) + small_harmonic
  // Different phases between layers create the depth illusion —
  // at any moment layers are in different positions relative to each other.

  let t = 0;

  (function loop() {
    t += 0.004;   // drift speed — lower = slower, dreamier

    for (const { el, amp, phX, phY, fX, fY } of layers) {
      const x = amp * Math.sin(fX * t + phX) + (amp * 0.25) * Math.sin(fX * 1.7 * t + phX + 1);
      const y = amp * Math.cos(fY * t + phY) + (amp * 0.20) * Math.cos(fY * 1.4 * t + phY + 2);
      el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }

    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
