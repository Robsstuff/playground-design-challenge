<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama - Mouse Follow</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 60%, #1c1c2e 0%, #060606 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  .scene {
    position: relative;
    width: min(92vw, 960px);
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 10px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 50px 120px rgba(0,0,0,0.95),
      0 20px 40px rgba(0,0,0,0.6);
  }

  #kb {
    position: absolute;
    inset: 0;
    transform-origin: 52% 52%;
    animation: kbzoom 4.5s cubic-bezier(0.2, 0, 0.35, 1) both;
  }
  @keyframes kbzoom {
    from { transform: scale(1.20); }
    to   { transform: scale(1.00); }
  }

  .lyr {
    position: absolute;
    top: -30%; left: -30%;
    width: 160%; height: 160%;
    background: url('photo.jpg') center / cover no-repeat;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  #l0 { z-index: 1; }

  #l1 {
    z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, black 0%, black 20%, transparent 38%);
    mask-image: linear-gradient(to bottom, black 0%, black 20%, transparent 38%);
  }

  #l2 {
    z-index: 3;
    -webkit-mask-image: linear-gradient(to right,
      black 0%, black 23%, transparent 37%,
      transparent 63%, black 77%, black 100%);
    mask-image: linear-gradient(to right,
      black 0%, black 23%, transparent 37%,
      transparent 63%, black 77%, black 100%);
  }

  .scene::after {
    content: '';
    position: absolute;
    inset: 0; z-index: 10;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.35) 100%);
  }

  #hint {
    position: fixed;
    bottom: 28px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.38);
    font: 13px/1 system-ui, sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }
  #hint.gone { opacity: 0; }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div id="kb">
    <div class="lyr" id="l0"></div>
    <div class="lyr" id="l1"></div>
    <div class="lyr" id="l2"></div>
  </div>
</div>
<p id="hint">Move your mouse to explore</p>

<script>
  const scene = document.getElementById('scene');
  const hint  = document.getElementById('hint');

  const layers = [
    { el: document.getElementById('l0'), spd: 0.10 },
    { el: document.getElementById('l1'), spd: 0.42 },
    { el: document.getElementById('l2'), spd: 0.95 },
  ];

  const CLAMP = 140;
  const LERP  = 0.06;   // slower lerp = floatier, dreamier feel

  let tx = 0, ty = 0;
  let gx = 0, gy = 0;
  let hinted = false;

  window.addEventListener('mousemove', (e) => {
    const rect = scene.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    // Normalized offset from centre (-1 to +1), then scaled
    gx = Math.max(-CLAMP, Math.min(CLAMP, ((e.clientX - cx) / (rect.width  / 2)) * CLAMP));
    gy = Math.max(-CLAMP, Math.min(CLAMP, ((e.clientY - cy) / (rect.height / 2)) * CLAMP));

    if (!hinted) {
      hinted = true;
      hint.classList.add('gone');
    }
  });

  // Touch: treat finger position as mouse
  window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const rect = scene.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    gx = Math.max(-CLAMP, Math.min(CLAMP, ((t.clientX - cx) / (rect.width  / 2)) * CLAMP));
    gy = Math.max(-CLAMP, Math.min(CLAMP, ((t.clientY - cy) / (rect.height / 2)) * CLAMP));
  }, { passive: false });

  (function loop() {
    tx += (gx - tx) * LERP;
    ty += (gy - ty) * LERP;

    for (const { el, spd } of layers) {
      el.style.transform = `translate3d(${tx * spd}px, ${ty * spd}px, 0)`;
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
